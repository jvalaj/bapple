<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="An interactive WebGL preview of a book-fold handset, built with TypeScript and three.js." />
    <meta name="color-scheme" content="light" />
    <title>iPhone Duo - Banana Store</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./favicon.ico" />
    <!-- Start the largest download early, at low priority so it never holds up the page, styles or menu. -->
    <link rel="preload" href="./assets/iPhone_Duo_Render.usdc" as="fetch" crossorigin fetchpriority="low" />
    <script type="module" crossorigin src="./assets/main-BdEQKyf-.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="./assets/main-D3qD_2T2.css">
    <style>
      /* Way back to the store: a small blue link above the title, like Apple's breadcrumbs */
      .page-heading { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
      .home-link { display: inline-flex; align-items: center; gap: 2px; margin-left: -4px; padding: 4px; border-radius: 8px; font-size: 14px; color: var(--accent); text-decoration: none; }
      .home-link svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .home-link:hover { text-decoration: underline; }
      .home-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main class="page">
      <div class="page-header">
        <div class="page-heading">
          <a class="home-link" href="../">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6" /></svg>
            Banana Store
          </a>
          <h1 class="page-title">Take a closer look.</h1>
        </div>
        <div class="upload-row">
          <button
            type="button"
            id="reset-upload"
            class="reset-button"
            aria-label="Reset to default image"
            title="Reset to default image"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" />
              <path d="M4.5 4.5v4h4" />
            </svg>
          </button>
          <button type="button" id="upload" class="upload-button" disabled>Upload custom image</button>
        </div>
      </div>

      <section class="viewer" aria-label="Foldable design">
        <div
          id="stage"
          class="stage"
          role="img"
          aria-label="3D model of the device. Drag to rotate and scroll to zoom."
        ></div>

        <div
          id="loader"
          class="loader"
          role="progressbar"
          aria-label="Loading 3D model"
          aria-busy="true"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span class="loader-spinner" aria-hidden="true"></span>
          <span class="loader-label">Loading 3D model</span>
          <span class="loader-track" aria-hidden="true"><span class="loader-bar"></span></span>
        </div>

        <div class="highlights" id="highlights">
          <div class="highlight-sheet is-collapsed" id="highlight-sheet" aria-live="polite"></div>
          <div class="highlight-steps">
            <button type="button" id="previous-highlight" class="step-button" aria-label="Previous highlight">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 14.5 5.5-5.5 5.5 5.5" /></svg>
            </button>
            <button type="button" id="next-highlight" class="step-button" aria-label="Next highlight">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 9.5 5.5 5.5 5.5-5.5" /></svg>
            </button>
          </div>
          <ul class="highlight-list" id="highlight-list"></ul>
        </div>


        <input id="upload-file" type="file" accept="image/*" hidden />
      </section>
    </main>
  </body>
</html>
